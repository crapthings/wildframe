name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_REPOSITORY: crapthings/wildframe
          ASSET_RELEASE: v0.1.0
          ASSET_ARCHIVE: wildframe-assets-v1.tar.gz
          ASSET_SHA256: 76efdb7d80f4ac0e07b1f2bd8685fd2111bb1f2b655b205f62d5473e20ce35d7
          ASSET_DIRECTORY: ${{ runner.temp }}/wildframe-assets
        run: |
          gh release download "$ASSET_RELEASE" --repo "$ASSET_REPOSITORY" --pattern "$ASSET_ARCHIVE" --dir "$ASSET_DIRECTORY"
          printf '%s  %s\n' "$ASSET_SHA256" "$ASSET_DIRECTORY/$ASSET_ARCHIVE" | sha256sum --check --strict
          tar -xzf "$ASSET_DIRECTORY/$ASSET_ARCHIVE" public/assets

      - name: Build for the Pages subpath
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: pnpm build

      - name: Include asset credits
        run: cp THIRD_PARTY_ASSETS.md dist/THIRD_PARTY_ASSETS.md

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
